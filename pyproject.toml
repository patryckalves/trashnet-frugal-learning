[project]
name = "trashnet-frugal-learning"
version = "0.1.0"
description = "Pipelines de Aprendizado Frugal e Classificação de Resíduos no Dataset TrashNet"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Anderson Cavalcante Moreira Lima" },
    { name = "Barbara Nepomuceno Guimarães" },
    { name = "Bianca Torres" },
    { name = "Lucas de Souza Macedo" },
    { name = "Patryck Harley Alves Barros" },
]
dependencies = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pillow>=10.2.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "ultralytics>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
